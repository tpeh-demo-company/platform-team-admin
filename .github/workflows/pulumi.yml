name: Pulumi Infrastructure

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Tag"]
    types:
      - completed

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────────
  lint-code:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Check code formatting with black
        run: uv run black --check --diff --target-version py312 .

      - name: Type check with mypy
        run: uv run mypy . --ignore-missing-imports

  # ── Static analysis ───────────────────────────────────────────────────────────
  static-analysis:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Security scan with bandit
        run: uv run bandit -r . -ll --exclude ./.venv

  # ── Pulumi preview ────────────────────────────────────────────────────────────
  pulumi-preview:
    runs-on: ubuntu-latest
    needs: [lint-code, static-analysis]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Fetch secrets from Bitwarden
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          base_url: https://vault.bitwarden.eu
          secrets: |
            f5789e30-d191-4558-b135-b4a100c506ee > PULUMI_ACCESS_TOKEN

      - name: Run Pulumi preview
        uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: Jdavid77/platformteamadministration/dev
          color: always
        env:
          PULUMI_ACCESS_TOKEN: ${{ env.PULUMI_ACCESS_TOKEN }}

  # ── Manual approval gate ──────────────────────────────────────────────────────
  approve-deployment:
    needs: pulumi-preview
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Await manual approval
        run: echo "Deployment approved"

  # ── Deploy ────────────────────────────────────────────────────────────────────
  pulumi-up:
    needs: approve-deployment
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Fetch secrets from Bitwarden
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          base_url: https://vault.bitwarden.eu
          secrets: |
            f5789e30-d191-4558-b135-b4a100c506ee > PULUMI_ACCESS_TOKEN

      - name: Run Pulumi up
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: Jdavid77/platformteamadministration/dev
          color: always
        env:
          PULUMI_ACCESS_TOKEN: ${{ env.PULUMI_ACCESS_TOKEN }}
